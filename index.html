<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082d3a">
<title>Aquoria · Gracias por descargar la app</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#176273 0,#0b3e4d 42%,#062632 100%)}
main{width:min(100%,560px);text-align:center;padding:56px 28px;border:1px solid rgba(255,255,255,.2);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.22);backdrop-filter:blur(8px)}
.brand{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#bde8e8;margin-bottom:36px}
.mark{width:64px;height:64px;margin:0 auto 28px;border:2px solid #bde8e8;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#bde8e8}
h1{font-size:clamp(32px,7vw,48px);line-height:1.08;margin:0 0 18px;font-weight:700}
p{font-size:17px;line-height:1.6;color:#d4e9eb;margin:0}
</style>
</head>
<body><main><div class="brand">Aquoria</div><div class="mark" aria-hidden="true">✓</div><h1>Gracias por descargar la app</h1><p>¡Te damos la bienvenida a Aquoria!</p></main></body>
</html>
